[project]
name = "EviGraph-R"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beir>=2.2.0",
    "boto3>=1.34.0",
    "datasets>=4.6.1",
    "dspy>=3.1.3",
    "einops>=0.8.2",
    "flagembedding==1.2.5",
    "huggingface-hub>=1.5.0",
    "langchain>=1.2.12",
    "langgraph>=1.1.1",
    "msgpack>=1.1.2",
    "mypy>=1.19.1",
    "networkx>=3.6.1",
    "numpy>=2.4.2",
    "openai>=2.26.0",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.2",
    "pytrec-eval-terrier>=0.5.10",
    "aiohttp>=3.9.0",
    "qdrant-client>=1.17.0",
    "rank-bm25>=0.2.2",
    "rocksdict>=0.3.29",
    "sentence-transformers>=5.2.3",
    "tokenizers>=0.22.2",
    "torch>=2.10.0",
    "tqdm>=4.67.3",
    "transformers>=5.3.0",
    "nltk>=3.9.4",
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "sse-starlette>=3.3.4",
]

[tool.mypy]
mypy_path = "src"
namespace_packages = false
ignore_missing_imports = true


[tool.pytest.ini_options]
markers = [
    "integration: marks tests requiring a live Qdrant instance (satisfied by Docker service in CI)",
    "hpc: marks tests requiring Singularity/HPC compute node — never run in CI",
    "slow: marks tests that are slow (typically use real models) — skip with -m 'not slow'",
]
filterwarnings = [
    "ignore::DeprecationWarning:torch.jit._script",
]
