services:

  qdrant:
    image: qdrant/qdrant:v1.13.6
    restart: unless-stopped
    ports:
      - "6334:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5      
      start_period: 30s
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      INDEXING_PROFILE: compose
      QDRANT_URL: http://qdrant:6333
      PYTHONPATH: /app/src
      HF_HOME: /app/hub
    volumes:
      # Mount local HF model cache — avoids re-downloading 6 GB of models on every build
      - ./hub:/app/hub
    depends_on:
      qdrant:
        condition: service_started

volumes:
  qdrant_data:
